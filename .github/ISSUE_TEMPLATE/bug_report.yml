name: Bug report
description: Report a problem with dotbugi-mcp
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! You can write in Korean or English (한국어로 작성해도 됩니다).
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us here.
      placeholder: I did ... I expected ... What actually happened is ...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the problem. Mention which tool or slash command you used.
      placeholder: |
        1. Connect with `/dotbugi:login`
        2. Ask "이번 주 과제 알려줘"
        3. ...
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System info
      description: dotbugi-mcp version (`npm view @dotbugi/mcp version` or plugin version), install method (plugin / `claude mcp add` / Claude Desktop), MCP client version, Node.js version, OS (Windows / macOS / Linux / WSL)
      render: text
      placeholder: |
        dotbugi-mcp: 0.4.5 (plugin)
        Claude Code: 2.1.300
        Node.js: 24.x
        OS: WSL (Ubuntu 24.04)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server stderr log or tool output, if the steps are not enough. Please paste text rather than images.

        Before posting, remove anything private: MoodleSession cookie, connect code, sesskey, student ID.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Read the [Contributing Guidelines](https://github.com/hs-shell/dotbugi-mcp/blob/main/CONTRIBUTING.md) and the [README troubleshooting](https://github.com/hs-shell/dotbugi-mcp#문제-해결).
          required: true
        - label: Check that there isn't [already an issue](https://github.com/hs-shell/dotbugi-mcp/issues) that reports the same bug.
          required: true
        - label: The bug still happens on the latest version.
          required: true
        - label: This is a concrete bug. For questions, open a [GitHub Discussion](https://github.com/hs-shell/dotbugi-mcp/discussions).
          required: true
