name: 기능 제안
description: dotbugi-mcp 에 추가할 기능을 제안해주세요
labels: [feat]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 작성해 주셔서 감사합니다.
  - type: textarea
    id: feature-description
    attributes:
      label: 설명
      description: 어떤 문제를 풀고 싶은지, 왜 필요한지 최대한 구체적으로 적어주세요. 직접 PR 을 보낼 생각이라면 여기에 알려주세요.
      placeholder: LMS 를 쓰는 학생으로서 [하고 싶은 것] 을 하고 싶습니다. 그러면 [얻는 것] 이 있습니다.
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: 제안하는 해결책
      description: 어떤 도구·명령이 어떻게 동작하면 좋을지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 대안
      description: 생각해 본 다른 방법이 있다면 적어주세요.
  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 그 밖의 맥락이나 스크린샷을 적어주세요.
  - type: checkboxes
    id: checkboxes
    attributes:
      label: 확인
      description: 이슈를 올리기 전에 아래를 확인해주세요
      options:
        - label: '[기여 안내](https://github.com/hs-shell/dotbugi-mcp/blob/main/CONTRIBUTING.md)를 읽었습니다.'
          required: true
        - label: 같은 기능을 제안한 [이슈](https://github.com/hs-shell/dotbugi-mcp/issues)가 없는지 확인했습니다.
          required: true
        - label: LMS 에 제출·작성하는 기능이 아닙니다 (dotbugi-mcp 는 읽기 전용입니다).
          required: true
