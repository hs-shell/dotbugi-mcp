name: Release Please

# 트렁크 기반 릴리즈: main 머지는 Release PR만 갱신하고,
# 그 Release PR을 머지할 때만 GitHub Release 생성 + npm 배포가 일어난다.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # ── 1) Release PR 유지 / Release PR 머지 시 태그·릴리즈 생성 ──────────
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # 기본 GITHUB_TOKEN 사용: 이 토큰으로 만든 Release PR에는 PR 검사 워크플로가 돌지 않는다.
      # (필요하면 dotbugi처럼 GitHub App 토큰으로 교체)
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2) 릴리즈 생성됨 → npm 배포 (Trusted Publishing, 토큰 없음) ──────
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing(OIDC) 필수
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # 배포 잡은 캐시 오염을 피하려고 npm 캐시를 쓰지 않는다
      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing은 npm CLI 11.5.1 이상 필요 — OIDC 권한이 있는 잡이라 정확한 버전으로 고정
      - name: npm CLI 업데이트
        run: npm install -g npm@11.21.1 && npm -v

      # OIDC 토큰이 있는 잡에서 라이프사이클 스크립트(husky 등)를 실행하지 않는다
      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: 빌드
        run: npm run build

      - name: 테스트
        run: npm test

      # Trusted Publisher가 stage 전용이라 대기 상태로만 올린다 — 소유자가 2FA로 승인해야 공개된다
      # (공개 저장소 + 공개 패키지 → provenance 자동 첨부)
      - name: npm 배포 (스테이징)
        run: npm stage publish
