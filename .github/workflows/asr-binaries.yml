name: ASR 바이너리

# antirez/qwen-asr 를 커밋 고정으로 빌드해 Release(asr-v*)에 올린다. `dotbugi-mcp asr install` 이 받는 파일이며,
# 올린 뒤 SHA256SUMS 값을 src/asr/pins.ts 의 QWEN_ASR_BINARY 에 고정해야 설치된다
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 태그 (예: asr-v1)'
        required: true
  push:
    tags:
      - 'asr-v*'

permissions:
  contents: read

env:
  QWEN_ASR_COMMIT: 924694251d9e0f18e5d86bbd06aa3ab5f870002d
  # upstream 의 -ffast-math 만 쓰면 일부 입력에서 '!!!!' 를 끝없이 출력한다 (#17 POC) — -fno-finite-math-only 필수
  COMMON_CFLAGS: -Wall -O3 -ffast-math -fno-finite-math-only -DUSE_BLAS

jobs:
  linux-x64:
    # 오래된 glibc 에서 빌드해야 더 많은 배포판에서 실행된다
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_VERSION: 0.3.34
      OPENBLAS_SHA256: cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed
    steps:
      - name: qwen-asr 체크아웃 (커밋 고정)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antirez/qwen-asr
          ref: ${{ env.QWEN_ASR_COMMIT }}
          path: qwen-asr
          persist-credentials: false

      - name: OpenBLAS 정적 라이브러리 빌드 (sha256 고정)
        run: |
          curl -fsSLo openblas.tar.gz "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz"
          echo "${OPENBLAS_SHA256}  openblas.tar.gz" | sha256sum -c -
          tar xzf openblas.tar.gz
          # DYNAMIC_ARCH: 실행하는 CPU 에 맞는 커널을 런타임에 고른다 (빌드 머신 CPU 에 묶이지 않게)
          OB_FLAGS="DYNAMIC_ARCH=1 TARGET=PRESCOTT NO_SHARED=1 NO_LAPACK=1 NO_LAPACKE=1 NOFORTRAN=1 USE_OPENMP=0 USE_THREAD=1 NUM_THREADS=64"
          make -C "OpenBLAS-${OPENBLAS_VERSION}" -j"$(nproc)" $OB_FLAGS libs
          make -C "OpenBLAS-${OPENBLAS_VERSION}" $OB_FLAGS PREFIX="$PWD/openblas" install

      - name: qwen_asr 빌드
        working-directory: qwen-asr
        run: |
          test "$(git rev-parse HEAD)" = "$QWEN_ASR_COMMIT"
          # -march=native 대신 x86-64-v3(AVX2·FMA) — 커널이 컴파일 시점 __AVX2__ 로 갈리므로 v2 면 느린 일반 경로가 된다
          make qwen_asr \
            CFLAGS="$COMMON_CFLAGS -march=x86-64-v3 -DUSE_OPENBLAS -I$GITHUB_WORKSPACE/openblas/include" \
            LDFLAGS="$GITHUB_WORKSPACE/openblas/lib/libopenblas.a -lm -lpthread"
          ldd qwen_asr
          if ldd qwen_asr | grep -qi openblas; then echo 'OpenBLAS 가 정적으로 링크되지 않았습니다'; exit 1; fi
          mv qwen_asr "$GITHUB_WORKSPACE/qwen_asr-linux-x64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen_asr-linux-x64
          path: qwen_asr-linux-x64
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    env:
      # ACCELERATE_NEW_LAPACK 인터페이스가 13.3 부터
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - name: qwen-asr 체크아웃 (커밋 고정)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antirez/qwen-asr
          ref: ${{ env.QWEN_ASR_COMMIT }}
          path: qwen-asr
          persist-credentials: false

      - name: qwen_asr 빌드 (Accelerate)
        working-directory: qwen-asr
        run: |
          test "$(git rev-parse HEAD)" = "$QWEN_ASR_COMMIT"
          make qwen_asr CFLAGS="$COMMON_CFLAGS -DACCELERATE_NEW_LAPACK" LDFLAGS="-lm -lpthread -framework Accelerate"
          otool -L qwen_asr
          mv qwen_asr "$GITHUB_WORKSPACE/qwen_asr-macos-arm64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen_asr-macos-arm64
          path: qwen_asr-macos-arm64
          if-no-files-found: error

  release:
    needs: [linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qwen_asr-*
          merge-multiple: true

      - name: Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          # 입력값은 스크립트에 직접 넣지 않고 환경변수로만 받는다 (명령 주입 방지)
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^asr-v[0-9]+$ ]] || { echo "태그 형식은 asr-v<숫자> 입니다: $TAG"; exit 1; }
          sha256sum qwen_asr-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" qwen_asr-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "$TAG (qwen-asr ${QWEN_ASR_COMMIT:0:7})" \
            --notes "antirez/qwen-asr@${QWEN_ASR_COMMIT} 빌드. sha256 은 SHA256SUMS 참고 → src/asr/pins.ts 에 고정."
