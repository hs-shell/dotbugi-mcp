name: PR 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR 본문에 연결된 이슈 참조가 있는지 검사 (이슈-먼저 정책 강제)
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 참조 확인
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Dependabot PR은 이슈 없이 자동 생성된다. 본문의 업스트림 릴리스 노트 링크로 우연히
            // 통과하던 것에 기대지 않도록 명시적으로 예외 처리한다. (브랜치명은 포크에서 위조 가능하므로 작성자로 판별)
            if (context.payload.pull_request.user?.login === 'dependabot[bot]') {
              core.info('Dependabot PR — 이슈 참조 검사 생략');
              return;
            }
            const body = context.payload.pull_request.body || '';
            // "#123", "Closes #123", "Fixes #45", "Resolves: #6" 등 + 전체 URL 형태 모두 허용
            const ref = /(close[sd]?|fix(e[sd])?|resolve[sd]?)?\s*:?\s*#\d+/i.test(body)
              || /github\.com\/[^/]+\/[^/]+\/issues\/\d+/i.test(body);
            if (!ref) {
              core.setFailed(
                'PR 본문에 연결된 이슈가 없습니다. ' +
                '`Closes #이슈번호` 형식으로 관련 이슈를 참조해주세요. ' +
                '(모든 변경은 이슈가 먼저 등록되어 있어야 합니다)'
              );
            }

  # 포맷·린트·취약점 검사는 OS 무관이라 ubuntu 에서 한 번만
  static:
    needs: issue-link # 이슈-먼저 정책: 이슈 참조 실패 시 빌드/테스트 낭비 방지
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사 (Prettier)
        run: npx prettier --check .

      - name: 린트 (ESLint)
        run: npm run lint

      - name: 의존성 취약점 검사 (high 이상 차단)
        run: npm audit --audit-level=high

  # 빌드·테스트는 OS별 분기(경로·권한·프로세스)가 실제로 돌도록 매트릭스
  build-test:
    needs: issue-link
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.1', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # build 스크립트가 rm/cp 를 쓰므로 Windows 에서도 npm 스크립트를 Git Bash 로 실행
      - name: npm 스크립트 셸 설정 (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: 타입 체크 + 빌드
        run: npm run build

      - name: 테스트
        run: npm run test

  # 필수 체크 이름(verify)을 유지하기 위한 집계 잡
  verify:
    if: always()
    needs: [static, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
