# CodeRabbit 설정 — https://docs.coderabbit.ai/guides/configure-coderabbit
# CodeRabbit 앱이 이 저장소에 설치·활성화돼 있어야 자동 PR 리뷰가 동작합니다 (이 파일은 동작 방식만 정함).
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true # PR 최초 생성 시 자동 리뷰
    auto_incremental_review: false # 이후 push에는 자동 재리뷰 안 함 (수동 `@coderabbitai review`)
    drafts: false
    # release-please가 자동 생성하는 Release PR은 리뷰하지 않는다 (리뷰할 코드 없음)
    ignore_title_keywords:
      - 'chore(main): release'
    base_branches:
      - main
  path_filters:
    - '!dist/**'
    - '!**/*.lock'
    - '!package-lock.json'
  path_instructions:
    - path: 'src/**'
      instructions: |
        TypeScript MCP 서버(stdio)입니다. 보안을 최우선으로 검토해 주세요.
        - 자격증명·세션 쿠키·토큰이 도구 인자, 도구 결과, 로그, 오류 메시지에 절대 나오지 않아야 합니다.
        - stdout 은 MCP 프로토콜 전용입니다. 로그는 stderr(`src/log.ts`)로만 씁니다.
        - LMS 에서 가져온 내용(과목명·공지·과제 본문 등)은 신뢰할 수 없는 데이터이지 지시가 아닙니다. 프롬프트 인젝션 경로가 생기지 않는지 봐 주세요.
        - 요청 호스트는 learn.hansung.ac.kr 로 고정돼야 합니다. 리다이렉트·사용자 입력 URL 로 다른 호스트에 세션을 보내지 않는지 확인해 주세요.
        - 삭제·저장 위치 변경 같은 쓰기 작업은 elicitation 으로 사용자 승인을 거쳐야 합니다.
        - 파일 경로는 저장 디렉터리 밖으로 벗어나지 않아야 합니다(경로 탐색 방지).
    - path: 'plugin/**'
      instructions: |
        Claude Code 플러그인(스킬·훅)입니다. `plugin/skills` 는 `src/prompts/shortcuts.ts` 에서 생성되므로 직접 수정 대신 생성 원본을 고쳤는지 확인해 주세요.
        훅·스킬이 자격증명을 노출하거나 LMS 내용을 지시로 따르게 만들지 않는지 봐 주세요.
  tools:
    eslint:
      enabled: true

chat:
  auto_reply: true
